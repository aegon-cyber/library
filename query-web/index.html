<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京东健康素材图库（测试版） — Search</title>
<style>
  :root {
    --bg: #F8F8F8; --card: #FFFFFF; --border: #1a1a1a; --text: #1a1a1a;
    --red: #C41230; --red-light: #FFF0F2; --red-dark: #8B0E22;
    --border-w: 2px; --shadow: 6px 6px 0px #1a1a1a; --shadow-sm: 3px 3px 0px #1a1a1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
    background-image: radial-gradient(#ddd 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .page-wrapper { width: 100%; max-width: 760px; }
  .global-header { margin-bottom: 24px; padding-left: 8px; display:flex; align-items:center; gap:28px; }
  .global-header .logo { width:64px; height:64px; flex-shrink:0; overflow:visible; }
  .global-header .logo img { width:120px; height:auto; object-fit:contain; margin:-28px 0 0 -28px; }
  .global-header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; letter-spacing: -0.5px; line-height:1; }
  .global-header .subtitle { font-weight: 600; font-size: 0.85rem; color: var(--muted); }
  .container { background: var(--card); border: var(--border-w) solid var(--border); border-radius: 12px; padding: 40px; box-shadow: var(--shadow); }
  .nav { display:flex; gap:16px; margin-bottom: 32px; border-bottom: var(--border-w) solid var(--border); padding-bottom: 24px; }
  .nav a {
    color: var(--text); text-decoration:none; padding: 12px 32px;
    border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 1rem; font-weight: 900;
    background: #fff; box-shadow: var(--shadow-sm); transition: all 0.1s;
  }
  .nav a:hover { background: var(--red-light); transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
  .nav a.active { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 2px 2px 0px var(--red); transform: translate(2px, 2px); }

  .search-box { display: flex; gap: 12px; margin-bottom: 16px; }
  .search-box input { flex: 1; margin: 0; padding: 16px 20px; background: var(--card); border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 1.05rem; font-weight: 800; outline: none; box-shadow: var(--shadow-sm); transition: all 0.1s; }
  .search-box input:focus { background: #f5f5f5; transform: translate(2px, 2px); box-shadow: 2px 2px 0px var(--red); }
  .search-box button {
    padding: 16px 32px; background: var(--red); color: #fff;
    border: var(--border-w) solid var(--border); border-radius: 8px;
    font-weight: 900; cursor: pointer; font-size: 1.1rem; text-transform: uppercase;
    box-shadow: var(--shadow-sm); transition: all 0.1s; white-space: nowrap;
  }
  .search-box button:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
  .search-box button:active:not(:disabled) { transform: translate(4px, 4px); box-shadow: 0px 0px 0px #000; }
  .search-box button:disabled { opacity: 0.6; cursor: not-allowed; box-shadow: 2px 2px 0px #000; transform: translate(2px,2px); }

  .hint { font-size: 0.85rem; margin-bottom: 24px; color: var(--muted); font-style: italic; }
  .parsed-tags { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 24px; }
  .parsed-tag { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 6px; font-weight: 900; font-size: 0.85rem; background: var(--bg); border: 2px solid var(--border); box-shadow: 3px 3px 0px #000; }
  .parsed-tag .label { font-size: 0.75rem; background: #000; color: #fff; padding: 2px 6px; border-radius: 4px; }
  .meta-text { font-size: 1rem; font-weight: 900; margin-bottom: 20px; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 8px; }

  .search-result-card {
    display: flex; gap: 20px; background: var(--card);
    border: var(--border-w) solid var(--border); border-radius: 8px;
    padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow-sm);
    transition: all 0.15s ease;
  }
  .search-result-card:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0px #000; background: #fdfdfd; }
  .search-result-card img { width: 150px; height: 110px; object-fit: cover; border: 3px solid var(--border); border-radius: 6px; flex-shrink: 0; box-shadow: 2px 2px 0px #000; cursor: pointer; }
  .search-result-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; }
  .search-result-info .name { font-weight: 900; font-size: 1.15rem; margin-bottom: 6px; }
  .search-result-info .desc { font-weight: 600; font-size: 0.9rem; margin-bottom: 12px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .search-meta-row { display: flex; gap: 12px; font-size: 0.8rem; font-weight: 800; flex-wrap: wrap; align-items: center; }
  .search-tag { background: var(--bg); border: 2px solid #000; padding: 4px 8px; border-radius: 4px; box-shadow: 2px 2px 0px #000; }
  .download-btn { margin-left: auto; background: var(--red); color: #000; text-decoration: none; border: 2px solid #000; padding: 6px 16px; font-weight: 900; font-size: 0.85rem; border-radius: 6px; box-shadow: 2px 2px 0px #000; transition: all 0.1s; }
  .download-btn:hover { background: var(--red-dark); transform: translate(-2px,-2px); box-shadow: 4px 4px 0px #000; }
  .download-btn:active { transform: translate(2px,2px); box-shadow: 0px 0px 0px #000; }
  .source-link { font-size:0.78rem; margin-top:4px; }
  .source-link a { color: var(--text); font-weight:700; }

  .empty { text-align: center; padding: 60px 0; font-weight: 900; font-size: 1.2rem; }
  .empty .icon { font-size: 4rem; margin-bottom: 16px; }
  .spinner { display:none; margin:40px auto; width:36px; height:36px; border:4px solid var(--border); border-top-color:var(--red); border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }

  /* Lightbox */
  .lightbox { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.92); z-index:1000; cursor:pointer; align-items:center; justify-content:center; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:92vw; max-height:92vh; border-radius:8px; border:4px solid #000; box-shadow: 0 0 60px rgba(0,0,0,0.5); cursor:auto; }
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="global-header">
    <div class="logo"><img src="/logo-small.png" alt="JD"></div>
    <div>
      <h1>京东健康素材图库</h1>
      <div class="subtitle">语义图像搜索引擎</div>
    </div>
  </div>
  <div class="container">
    <div class="nav">
      <a href="/upload-web/">上传</a>
      <a href="/query-web/" class="active">搜索</a>
      <a href="/library-web/">文件库</a>
    </div>

    <div class="search-box">
      <input type="text" id="queryInput" placeholder="关键词用空格隔开，例如：云药箱 海报..." autofocus>
      <button id="searchBtn" disabled>搜索</button>
    </div>
    <div class="hint">
      <em>关键词像钓鱼，偏一点就跑了——换个饵试试</em>
    </div>

    <div class="parsed-tags" id="parsedTags"></div>
    <div class="meta-text" id="searchMeta"></div>
    <div class="spinner" id="spinner"></div>
    <div class="results" id="searchError" style="display:none;"></div>
    <div id="searchResults"></div>
    <div class="empty" id="emptyState">
      <div class="icon">🔎</div>
      <p>输入描述开始搜索</p>
    </div>
  </div>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <img id="lightboxImg" src="" alt="">
</div>

<script>
const API = '';
const queryInput = document.getElementById('queryInput');
const searchBtn = document.getElementById('searchBtn');
const spinner = document.getElementById('spinner');
const searchError = document.getElementById('searchError');
const searchMeta = document.getElementById('searchMeta');
const searchResults = document.getElementById('searchResults');
const emptyState = document.getElementById('emptyState');
const parsedTags = document.getElementById('parsedTags');

queryInput.addEventListener('input', () => searchBtn.disabled = !queryInput.value.trim());
queryInput.addEventListener('keydown', e => { if (e.key === 'Enter' && queryInput.value.trim()) doSearch(); });
searchBtn.addEventListener('click', doSearch);

(async () => {
  try {
    const r = await fetch(`${API}/api/images`);
    const imgs = await r.json();
    if (Array.isArray(imgs) && imgs.length) {
      const dupes = imgs.filter(i => i.duplicate_of).length;
      const unique = imgs.length - dupes;
      let txt = `数据库：${unique} 张独立图片`;
      searchMeta.textContent = txt;
    }
  } catch(e) {}
})();

async function doSearch() {
  const query = queryInput.value.trim();
  if (!query) return;
  searchBtn.disabled = true; spinner.style.display = 'block';
  searchError.style.display = 'none'; searchResults.innerHTML = '';
  emptyState.style.display = 'none'; parsedTags.innerHTML = '';
  searchMeta.textContent = '搜索ING...';

  try {
    const r = await fetch(`${API}/api/search`, {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query, top_n: 10 }),
    });
    const data = await r.json();
    if (!r.ok) { showSearchError(data.error || '搜索 FAILED'); return; }

    if (data.parsed) {
      const tags = [];
      if (data.parsed.uploader) tags.push(`<span class="parsed-tag"><span class="label">上传ER</span>${data.parsed.uploader}</span>`);
      if (data.parsed.date_from || data.parsed.date_to) tags.push(`<span class="parsed-tag"><span class="label">日期</span>${data.parsed.date_from||'...'}~${data.parsed.date_to||'...'}</span>`);
      if (data.parsed.query !== query) tags.push(`<span class="parsed-tag"><span class="label">搜索词</span>${data.parsed.query}</span>`);
      parsedTags.innerHTML = tags.join('');
    }

    const results = data.results;
    if (!results || !results.length) {
      emptyState.innerHTML = '<div class="icon">😕</div><p>没有匹配结果</p>';
      emptyState.style.display = 'block';
      searchMeta.textContent = '结果：0 张';
      return;
    }

    searchMeta.textContent = `找到 [ ${results.length} ] 条结果`;
    searchResults.innerHTML = results.map(r => {
      const srcHtml = r.source_file ? `<div class="source-link">📎 <a href="${r.source_url||'#'}" target="_blank">${r.source_file}</a></div>` : '';
      return `<div class="search-result-card">
        <img src="${r.thumbnail_path || r.file_path}" alt="${r.file_name}" onclick="event.stopPropagation();openLightbox('${r.file_path}')" onerror="this.style.display='none'">
        <div class="search-result-info">
          <div>
            <div class="name">${r.file_name}</div>
            <div class="desc">${r.description || '无描述'}</div>
            ${srcHtml}
          </div>
          <div class="search-meta-row">
            <span class="search-tag">${r.uploader||'?'}</span>
            <span class="search-tag">${(r.upload_time||'').slice(0,10)}</span>
            <a href="${r.file_path}" download="${r.file_name}" class="download-btn" title="下载原图">⬇ 下载</a>
          </div>
        </div>
      </div>`;
    }).join('');

  } catch (e) {
    showSearchError(`网络错误： ${e.message}`);
  } finally {
    searchBtn.disabled = false; spinner.style.display = 'none';
  }
}

function showSearchError(msg) {
  searchError.innerHTML = `<div class="result-item err">✕ ${msg}</div>`;
  searchError.style.display = 'block';
  searchMeta.textContent = '异常';
}

function openLightbox(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('show');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('show');
}
</script>
</body>
</html>
