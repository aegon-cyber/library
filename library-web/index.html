<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIBRARY AGENT — Library</title>
<style>
  :root {
    --bg: #F8F8F8; --card: #FFFFFF; --border: #1a1a1a; --text: #1a1a1a;
    --red: #C41230; --red-light: #FFF0F2; --red-dark: #8B0E22;
    --border-w: 2px; --shadow: 6px 6px 0px #1a1a1a; --shadow-sm: 3px 3px 0px #1a1a1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
    background-image: radial-gradient(#000 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .page-wrapper { width: 100%; max-width: 800px; }
  .global-header { margin-bottom: 24px; padding-left: 8px; display:flex; align-items:center; gap:18px; }
  .global-header .logo { width:64px; height:64px; flex-shrink:0; overflow:visible; }
  .global-header .logo img { width:120px; height:auto; object-fit:contain; margin:-28px 0 0 -28px; }
  .global-header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; letter-spacing: -0.5px; line-height:1; }
  .global-header .subtitle { font-weight: 600; font-size: 0.85rem; color: var(--muted); }
  .container { background: var(--card); border: var(--border-w) solid var(--border); border-radius: 12px; padding: 40px; box-shadow: var(--shadow); }
  .nav { display:flex; gap:16px; margin-bottom: 32px; border-bottom: var(--border-w) solid var(--border); padding-bottom: 24px; }
  .nav a {
    color: var(--text); text-decoration:none; padding: 12px 32px;
    border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 1rem; font-weight: 900;
    background: #fff; box-shadow: var(--shadow-sm); transition: all 0.1s;
  }
  .nav a:hover { background: var(--red-light); transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
  .nav a.active { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 2px 2px 0px var(--red); transform: translate(2px, 2px); }

  .tabs { display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; }
  .tab {
    padding:10px 20px; border:var(--border-w) solid var(--border); border-radius:6px;
    font-size:0.85rem; cursor:pointer; font-weight:800; background:var(--bg);
    box-shadow: var(--shadow-sm); transition:all .1s;
  }
  .tab:hover { background:var(--red-light); border-color:var(--red); transform:translate(-2px,-2px); box-shadow:6px 6px 0px #000; }
  .tab.on { background:#fff; color:var(--red); border-color:var(--red); box-shadow:2px 2px 0px #000; transform:translate(2px,2px); }
  .tab .count { font-size:0.7rem; margin-left:4px; opacity:0.6; }

  .file-card {
    display: flex; gap: 16px; background: var(--card);
    border: var(--border-w) solid var(--border); border-radius: 8px;
    padding: 16px 20px; margin-bottom: 12px; box-shadow: var(--shadow-sm);
    transition: all 0.15s;
  }
  .file-card:hover { transform: translate(-4px, -4px); box-shadow: 8px 8px 0px #000; }
  .file-card .thumb {
    width:56px; height:56px; border-radius:6px; border:2px solid var(--border);
    flex-shrink:0; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; background:var(--bg); overflow:hidden;
  }
  .file-card .thumb img { width:100%; height:100%; object-fit:cover; }
  .thumb.docx { background:var(--red-light); }
  .thumb.pdf { background:var(--red); color:#fff; }
  .thumb.img { background:var(--red-light); }
  .file-card .info { flex:1; min-width:0; }
  .file-card .name { font-weight:900; font-size:0.95rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-bottom:4px; }
  .file-card .meta { font-size:0.8rem; font-weight:700; display:flex; gap:14px; flex-wrap:wrap; }
  .file-card .img-count { background:var(--red); color:#fff; border:2px solid #000; padding:4px 10px; border-radius:4px; font-weight:900; font-size:0.8rem; flex-shrink:0; align-self:center; box-shadow:2px 2px 0px #000; }
  .file-card .dl-btn { flex-shrink:0; align-self:center; }
  .file-card .dl-btn a { background:var(--red-light); color:#000; text-decoration:none; border:2px solid #000; padding:6px 14px; font-weight:900; font-size:0.85rem; border-radius:6px; box-shadow:2px 2px 0px #000; transition:all .1s; }
  .file-card .dl-btn a:hover { transform:translate(-2px,-2px); box-shadow:4px 4px 0px #000; }

  .empty { text-align:center; padding:60px 0; font-weight:900; font-size:1.1rem; }
  .spinner { display:none; margin:40px auto; width:36px; height:36px; border:4px solid var(--border); border-top-color:var(--red); border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="global-header">
        <div class="logo"><img src="/PR-Logo-small.png" alt="JD"></div>
        <div>
    <h1>LIBRARY AGENT</h1>
    <div class="subtitle">已索引文件浏览器</div>
        </div>
  </div>
  <div class="container">
    <div class="nav">
      <a href="/upload-web/">上传</a>
      <a href="/query-web/">搜索</a>
      <a href="/library-web/" class="active">文件库</a>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab on" data-type="docx">📄 DOCX<span class="count" id="cnt-docx"></span></button>
      <button class="tab" data-type="pdf">📕 PDF<span class="count" id="cnt-pdf"></span></button>
      <button class="tab" data-type="image">🖼 图片<span class="count" id="cnt-image"></span></button>
      <button class="tab" data-type="all">全部<span class="count" id="cnt-all"></span></button>
    </div>

    <div class="spinner" id="spinner"></div>
    <div id="list"></div>
    <div class="empty" id="empty"><p>加载中...</p></div>
  </div>
</div>

<script>
const API = '';
let allGroups = [];
let currentType = 'docx';

function groupBySource(images) {
  const groups = {};
  images.forEach(img => {
    const src = (img.source_file || '').trim();
    let key, type;
    if (!src || src === img.file_name) { key = img.file_name; type = 'image'; }
    else { key = src; type = src.toLowerCase().endsWith('.pdf') ? 'pdf' : 'docx'; }
    if (!groups[key]) groups[key] = { type, name: src || img.file_name, url: '', images: [], uploader: img.uploader, upload_time: img.upload_time, thumbnail: '' };
    groups[key].images.push(img);
    if (!groups[key].url && img.source_url) groups[key].url = img.source_url;
    if (!groups[key].thumbnail && img.thumbnail_path) groups[key].thumbnail = img.thumbnail_path;
    if ((img.upload_time||'') < (groups[key].upload_time||'')) { groups[key].upload_time = img.upload_time; groups[key].uploader = img.uploader; }
  });
  return Object.values(groups).sort((a,b) => (b.upload_time||'').localeCompare(a.upload_time||''));
}

function renderTabs() {
  const counts = { docx:0, pdf:0, image:0 };
  allGroups.forEach(g => { counts[g.type] = (counts[g.type]||0) + 1; });
  document.getElementById('cnt-docx').textContent = counts.docx || '';
  document.getElementById('cnt-pdf').textContent = counts.pdf || '';
  document.getElementById('cnt-image').textContent = counts.image || '';
  document.getElementById('cnt-all').textContent = allGroups.length || '';
}

function renderList() {
  const filtered = currentType === 'all' ? allGroups : allGroups.filter(g => g.type === currentType);
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');
  if (!filtered.length) { empty.innerHTML = '<p>此分类暂无文件</p>'; empty.style.display='block'; list.innerHTML=''; return; }
  empty.style.display='none';

  const iconMap = { docx:'📄', pdf:'📕', image:'🖼' };
  list.innerHTML = filtered.map(g => {
    const time = (g.upload_time||'').slice(0,10);
    const imgCount = g.images.length;
    const thumb = g.thumbnail || '';
    const dlUrl = g.url || (g.images[0]?.file_path || '');
    return `<div class="file-card">
      <div class="thumb ${g.type}">${thumb ? `<img src="${thumb}">` : iconMap[g.type]}</div>
      <div class="info">
        <div class="name">${g.name || '(未命名)'}</div>
        <div class="meta"><span>${g.uploader||'-'}</span><span>${time||'-'}</span></div>
      </div>
      <div class="img-count">${imgCount} 张图</div>
      ${dlUrl ? `<div class="dl-btn"><a href="${dlUrl}" download>⬇ 下载</a></div>` : ''}
    </div>`;
  }).join('');
}

document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentType = tab.dataset.type;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
  renderList();
});

(async () => {
  try {
    const resp = await fetch(`${API}/api/images`);
    const images = await resp.json();
    if (Array.isArray(images)) {
      allGroups = groupBySource(images);
      renderTabs();
      renderList();
    }
  } catch(e) { document.getElementById('empty').innerHTML = '<p>加载失败</p>'; }
})();
</script>
</body>
</html>
