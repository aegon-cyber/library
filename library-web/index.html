<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📚 文件库 — Library Agent</title>
<style>
  :root {
    --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a;
    --text: #e0e0e0; --muted: #888; --accent: #3ecf8e;
    --accent-dim: #2a5f3f;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
  }
  .container { width: 100%; max-width: 800px; }
  h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.88rem; }
  .nav { display:flex; gap:10px; margin-bottom: 24px; }
  .nav a {
    color: var(--muted); text-decoration:none; padding:5px 10px;
    border:1px solid var(--border); border-radius:6px; font-size:0.8rem;
  }
  .nav a.active { color: var(--accent); border-color: var(--accent-dim); background: #1a2a22; }

  .tabs { display:flex; gap:8px; margin-bottom: 20px; flex-wrap:wrap; }
  .tab {
    padding:7px 16px; border:1px solid var(--border); border-radius:6px;
    font-size:0.82rem; cursor:pointer; color:var(--muted); background:none;
    transition: all .15s;
  }
  .tab:hover { border-color:#555; }
  .tab.on { color:var(--accent); border-color:var(--accent-dim); background:#1a2a22; }
  .tab .count { color:var(--muted); font-size:0.7rem; margin-left:4px; }

  .file-card {
    display: flex; gap: 14px; background:var(--card);
    border:1px solid var(--border); border-radius:10px;
    padding:14px 16px; margin-bottom:8px; transition:border-color .15s;
  }
  .file-card:hover { border-color:#444; }
  .file-card .icon {
    width:44px; height:44px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    font-size:1.2rem; flex-shrink:0;
  }
  .icon.docx { background:#1a2a3a; }
  .icon.pdf  { background:#2a1a1a; }
  .icon.img  { background:#1a2a22; }
  .file-card .info { flex:1; min-width:0; }
  .file-card .name {
    font-weight:500; font-size:0.9rem; white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis; margin-bottom:3px;
  }
  .file-card .meta {
    font-size:0.76rem; color:var(--muted);
    display:flex; gap:14px; flex-wrap:wrap;
  }
  .file-card .images-count {
    background:var(--bg); padding:2px 8px; border-radius:4px;
    font-size:0.72rem; color:var(--accent); flex-shrink:0;
    align-self:center;
  }

  .empty { text-align:center; padding:60px 0; color:var(--muted); }
  .spinner { display:none; margin:40px auto; width:24px; height:24px;
             border:2px solid var(--border); border-top-color:var(--accent);
             border-radius:50%; animation:spin .6s linear infinite; }
  @keyframes spin { to{transform:rotate(360deg);} }
</style>
</head>
<body>
<div class="container">
  <h1>📚 文件库</h1>
  <p class="subtitle">按来源文档浏览已索引的文件</p>

  <div class="nav">
    <a href="/upload-web/">📤 上传</a>
    <a href="/query-web/">🔍 搜索</a>
    <a href="/library-web/" class="active">📚 文件库</a>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab on" data-type="docx">📄 DOCX<span class="count" id="cnt-docx"></span></button>
    <button class="tab" data-type="pdf">📕 PDF<span class="count" id="cnt-pdf"></span></button>
    <button class="tab" data-type="image">🖼 图片<span class="count" id="cnt-image"></span></button>
    <button class="tab" data-type="all">全部<span class="count" id="cnt-all"></span></button>
  </div>

  <div class="spinner" id="spinner"></div>
  <div id="list"></div>
  <div class="empty" id="empty">
    <p>加载中…</p>
  </div>
</div>

<script>
const API = '';

let allGroups = [];  // { type, name, url, images[], uploader, upload_time }
let currentType = 'docx';

// Group images by source document
function groupBySource(images) {
  const groups = {};
  images.forEach(img => {
    const src = (img.source_file || '').trim();
    let key, type;
    if (!src || src === img.file_name) {
      // Standalone image
      key = img.file_name;
      type = 'image';
    } else {
      key = src;
      type = src.toLowerCase().endsWith('.pdf') ? 'pdf' : 'docx';
    }
    if (!groups[key]) groups[key] = { type, name: src || img.file_name, url: img.source_url || '', images: [], uploader: img.uploader, upload_time: img.upload_time };
    groups[key].images.push(img);
    // Keep earliest upload_time
    if ((img.upload_time || '') < (groups[key].upload_time || '')) {
      groups[key].upload_time = img.upload_time;
      groups[key].uploader = img.uploader;
    }
  });
  return Object.values(groups).sort((a,b) => (b.upload_time||'').localeCompare(a.upload_time||''));
}

function renderTabs() {
  const counts = { docx:0, pdf:0, image:0 };
  allGroups.forEach(g => { counts[g.type] = (counts[g.type]||0) + 1; });
  document.getElementById('cnt-docx').textContent = counts.docx || '';
  document.getElementById('cnt-pdf').textContent = counts.pdf || '';
  document.getElementById('cnt-image').textContent = counts.image || '';
  document.getElementById('cnt-all').textContent = allGroups.length || '';
}

function renderList() {
  const filtered = currentType === 'all' ? allGroups : allGroups.filter(g => g.type === currentType);
  const list = document.getElementById('list');
  const empty = document.getElementById('empty');

  if (!filtered.length) {
    empty.innerHTML = '<p>暂无此类文件</p>';
    empty.style.display = 'block';
    list.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  list.innerHTML = filtered.map(g => {
    const iconMap = { docx:'📄', pdf:'📕', image:'🖼' };
    const time = (g.upload_time || '').slice(0,10);
    const imgCount = g.images.length;
    return `
    <div class="file-card">
      <div class="icon ${g.type}">${iconMap[g.type]}</div>
      <div class="info">
        <div class="name">${g.name || '(unnamed)'}</div>
        <div class="meta">
          <span>${g.uploader || '-'}</span>
          <span>${time || '-'}</span>
        </div>
      </div>
      <div class="images-count">${imgCount} 张图</div>
    </div>`;
  }).join('');
}

// Tab switch
document.getElementById('tabs').addEventListener('click', e => {
  const tab = e.target.closest('.tab');
  if (!tab) return;
  currentType = tab.dataset.type;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t === tab));
  renderList();
});

// Load
(async () => {
  try {
    const resp = await fetch(`${API}/api/images`);
    const images = await resp.json();
    if (Array.isArray(images)) {
      allGroups = groupBySource(images);
      renderTabs();
      renderList();
    }
  } catch(e) {
    document.getElementById('empty').innerHTML = '<p>加载失败</p>';
  }
})();
</script>
</body>
</html>
