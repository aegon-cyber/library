<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>京东健康素材图库（测试版） — Upload</title>
<style>
  :root {
    --bg: #F8F8F8; --card: #FFFFFF; --border: #1a1a1a; --text: #1a1a1a;
    --red: #C41230; --red-light: #FFF0F2; --red-dark: #8B0E22;
    --muted: #888;
    --border-w: 2px; --shadow: 6px 6px 0px #1a1a1a; --shadow-sm: 3px 3px 0px #1a1a1a;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
    background-image: radial-gradient(#ddd 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .page-wrapper { width: 100%; max-width: 760px; }

  .global-header { margin-bottom: 24px; padding-left: 8px; display:flex; align-items:center; gap:28px; }
  .global-header .logo { width:64px; height:64px; flex-shrink:0; overflow:visible; }
  .global-header .logo img { width:120px; height:auto; object-fit:contain; margin:-28px 0 0 -28px; }
  .global-header h1 { font-size: 1.8rem; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; letter-spacing: -0.5px; line-height:1; }
  .global-header .subtitle { font-weight: 600; font-size: 0.85rem; color: var(--muted); }

  .container { background: var(--card); border: var(--border-w) solid var(--border); border-radius: 12px; padding: 40px; box-shadow: var(--shadow); }
  .nav { display:flex; gap:16px; margin-bottom: 32px; border-bottom: var(--border-w) solid var(--border); padding-bottom: 24px; }
  .nav a {
    color: var(--text); text-decoration:none; padding: 12px 32px;
    border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 1rem; font-weight: 900;
    background: #fff; box-shadow: var(--shadow-sm); transition: all 0.1s;
  }
  .nav a:hover { background: var(--red-light); transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
  .nav a.active { background: #fff; color: var(--red); border-color: var(--red); box-shadow: 2px 2px 0px var(--red); transform: translate(2px, 2px); }

  .dropzone {
    border: 4px dashed var(--border); border-radius: 12px;
    padding: 80px 20px; text-align: center; cursor: pointer;
    background: var(--card); box-shadow: var(--shadow-sm);
    transition: all 0.15s ease-out; margin-bottom: 24px;
  }
  .dropzone:hover, .dropzone.drag-over {
    background: var(--bg); border-style: solid;
    transform: translate(-4px, -4px); box-shadow: 8px 8px 0px #000;
  }
  .dropzone .icon { font-size: 3.5rem; margin-bottom: 16px; }
  .dropzone h3 { font-size: 1.5rem; font-weight: 900; margin-bottom: 12px; }
  .dropzone p { font-weight: 700; font-size: 0.95rem; }
  #fileInput { display: none; }

  .queue-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; font-size: 1.1rem; font-weight: 900; display: none; }
  .queue-header.show { display: flex; }
  .clear-btn { background: var(--card); border: 2px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; font-size: 0.85rem; font-weight: 800; cursor: pointer; box-shadow: 2px 2px 0px #000; transition: all 0.1s; }
  .clear-btn:hover { background: var(--red); color: #fff; }
  .clear-btn:active { transform: translate(2px,2px); box-shadow: 0px 0px 0px #000; }

  .queue { margin-bottom: 24px; }
  .file-item {
    display: flex; align-items: center; gap: 16px; padding: 16px; background: var(--card);
    border: var(--border-w) solid var(--border); border-radius: 8px;
    margin-bottom: 12px; box-shadow: var(--shadow-sm); animation: slideIn 0.2s ease forwards;
  }
  .file-item:hover { background: #fcfcfc; transform: translate(-2px, -2px); box-shadow: 6px 6px 0px #000; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }

  .type-icon { width: 48px; height: 48px; border-radius: 6px; border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 0.75rem; }
  .type-icon.img { background: var(--bg); }
  .type-icon.pdf { background: var(--red); color: #fff; }
  .type-icon.docx { background: var(--bg); }
  .file-item .info { flex: 1; min-width: 0; }
  .file-item .name { font-size: 1.05rem; font-weight: 900; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-item .meta { font-size: 0.85rem; font-weight: 700; margin-top: 4px; }
  .file-item .remove { background: var(--card); border: 2px solid var(--border); color: var(--text); cursor: pointer; width: 36px; height: 36px; border-radius: 6px; font-size: 1.4rem; font-weight: 900; line-height: 1; box-shadow: 2px 2px 0px #000; transition: all 0.1s; }
  .file-item .remove:hover { background: var(--red); color: #fff; }
  .file-item .remove:active { transform: translate(2px,2px); box-shadow: 0px 0px 0px #000; }

  .status { font-size: 0.8rem; padding: 4px 12px; border-radius: 4px; font-weight: 900; border: 2px solid var(--border); }
  .status.waiting { background: #eee; }
  .status.processing { background: var(--bg); box-shadow: 2px 2px 0px #000; }
  .status.done { background: var(--red); box-shadow: 2px 2px 0px #000; }
  .status.failed { background: var(--red); color: #fff; box-shadow: 2px 2px 0px #000; }

  .form-group { margin-bottom: 24px; }
  .form-group label { display: block; font-size: 0.95rem; font-weight: 900; margin-bottom: 8px; text-transform: uppercase; }
  .form-group input { width: 100%; padding: 16px 20px; background: var(--card); border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 1.05rem; font-weight: 800; outline: none; box-shadow: var(--shadow-sm); transition: all 0.1s; }
  .form-group input:focus { background: var(--bg); transform: translate(2px, 2px); box-shadow: 2px 2px 0px #000; }

  button.primary { background: var(--red); color: #fff;
    width: 100%; padding: 20px; background: var(--red); color: #fff;
    border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 1.2rem;
    font-weight: 900; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
    box-shadow: var(--shadow); transition: all 0.1s;
  }
  button.primary:hover:not(:disabled) { transform: translate(-2px, -2px); box-shadow: 10px 10px 0px #000; }
  button.primary:active:not(:disabled) { transform: translate(6px, 6px); box-shadow: 2px 2px 0px #000; background: #e03e3e; }
  button.primary:disabled { background: #ccc; color: #666; cursor: not-allowed; transform: translate(4px,4px); box-shadow: 4px 4px 0px #000; }

  .results { margin-top: 24px; display: flex; flex-direction: column; gap: 12px; }
  .result-item { padding: 16px; border: var(--border-w) solid var(--border); border-radius: 8px; font-size: 0.95rem; font-weight: 800; box-shadow: var(--shadow-sm); background: var(--card); animation: slideIn 0.2s ease forwards; }
  .result-item.ok { background: var(--red); }
  .result-item.err { background: var(--red); color: #fff; }
</style>
</head>
<body>
<div class="page-wrapper">
  <div class="global-header">
        <div class="logo"><img src="/logo-small.png" alt="JD"></div>
        <div>
    <h1>京东健康素材图库</h1>
    <div class="subtitle">AI 文件处理终端 · 硬核入库引擎</div>
        </div>
  </div>
  <div class="container">
    <div class="nav">
      <a href="/upload-web/" class="active">上传</a>
      <a href="/query-web/">搜索</a>
      <a href="/library-web/">文件库</a>
    </div>

    <div class="dropzone" style="background:#e8e8e8;border-color:#bbb;cursor:not-allowed;box-shadow:none;transform:none!important;" id="dropzone">
      <div class="icon" style="opacity:0.35;">🚫</div>
      <h3 style="color:#999;">上传功能暂未开放</h3>
      <p style="color:#aaa;">（待开放）</p>
    </div>
    <input type="file" id="fileInput" accept="image/*,.pdf,.docx" multiple disabled>

    <div class="queue-header" id="queueHeader">
      <span id="queueCount">队列</span>
      <button class="clear-btn" id="clearAllBtn">清空全部</button>
    </div>
    <div class="queue" id="queue"></div>

    <div class="form-group">
      <label>操作人 ID</label>
      <input type="text" id="uploader" placeholder="输入操作人标识..." value="test_user">
    </div>

    <button class="primary" id="uploadBtn" disabled>全部上传</button>
    <div class="results" id="uploadResults"></div>
  </div>
</div>

<script>
const API = '';
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const queue = document.getElementById('queue');
const queueHeader = document.getElementById('queueHeader');
const queueCount = document.getElementById('queueCount');
const clearAllBtn = document.getElementById('clearAllBtn');
const uploadBtn = document.getElementById('uploadBtn');
const uploadResults = document.getElementById('uploadResults');

let fileQueue = [];
let isProcessing = false;

window.addEventListener('beforeunload', e => {
  if (isProcessing) { e.preventDefault(); e.returnValue = 'Upload in progress!'; }
});

// Upload disabled: dropzone.addEventListener('click', () => fileInput.click());
// Upload disabled: dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
// Upload disabled
// Upload disabled
// Upload disabled

function addFiles(files) {
  files.forEach(f => { if (isValid(f)) fileQueue.push({ id: Date.now() + Math.random(), file: f, status: 'waiting' }); });
  renderQueue();
}
function isValid(f) {
  const n = f.name.toLowerCase();
  return ['jpg','jpeg','png','gif','webp','bmp','pdf','docx'].includes(n.split('.').pop());
}
function renderQueue() {
  queue.innerHTML = fileQueue.map(item => {
    const f = item.file;
    const cls = typeClass(f.name);
    const size = f.size > 1024*1024 ? (f.size/(1024*1024)).toFixed(1) + ' MB' : Math.round(f.size/1024) + ' KB';
    let s = '';
    if (item.status === 'processing') s = '<span class="status processing">处理中...</span>';
    else if (item.status === 'done') s = '<span class="status done">成功</span>';
    else if (item.status === 'failed') s = '<span class="status failed">失败</span>';
    else s = '<span class="status waiting">队列D</span>';
    return `<div class="file-item"><div class="type-icon ${cls}">${typeText(f.name)}</div><div class="info"><div class="name">${f.name}</div><div class="meta">${size}${item.error ? ' ⚠ '+item.error : ''}</div></div>${s}${item.status==='waiting'?`<button class="remove" data-id="${item.id}">×</button>`:''}</div>`;
  }).join('');
  queue.querySelectorAll('.remove').forEach(b => b.addEventListener('click', () => { fileQueue = fileQueue.filter(x => x.id !== Number(b.dataset.id)); renderQueue(); }));
  updateUI();
}
function updateUI() {
  const c = fileQueue.length;
  queueCount.textContent = c ? `队列 [ ${c} ] 个文件` : '队列';
  queueHeader.classList.toggle('show', c > 0);
  uploadBtn.disabled = c === 0 || fileQueue.some(f => f.status === 'processing');
  uploadBtn.textContent = c ? `上传 [ ${c} ] 个文件` : '全部上传';
}
clearAllBtn.addEventListener('click', () => { fileQueue = fileQueue.filter(f => f.status !== 'waiting'); renderQueue(); });

function typeText(n) { const e = n.split('.').pop().toLowerCase(); if (['png','jpg','jpeg','gif','webp','bmp'].includes(e)) return 'IMG'; if (e === 'pdf') return 'PDF'; if (e === 'docx') return 'DOCX'; return 'FILE'; }
function typeClass(n) { const e = n.split('.').pop().toLowerCase(); if (['png','jpg','jpeg','gif','webp','bmp'].includes(e)) return 'img'; if (e === 'pdf') return 'pdf'; if (e === 'docx') return 'docx'; return ''; }

uploadBtn.addEventListener('click', async () => {
  const pending = fileQueue.filter(f => f.status === 'waiting');
  if (!pending.length) return;
  uploadBtn.disabled = true; isProcessing = true;
  const uploader = document.getElementById('uploader').value || 'test_user';
  uploadResults.innerHTML = '';
  for (const item of pending) {
    item.status = 'processing'; renderQueue();
    const fd = new FormData();
    fd.append('file', item.file); fd.append('uploader', uploader);
    try {
      const resp = await fetch(`${API}/api/process`, { method: 'POST', body: fd });
      const data = await resp.json();
      if (resp.ok) {
        item.status = 'done';
        let sum = data.type === 'accepted' ? '已接收 - 后台处理中' : data.type === 'docx' ? `DOCX · ${data.image_count} 张图` : `图片 · ${data.embedding_dim}d`;
        uploadResults.innerHTML += `<div class="result-item ok">✓ ${data.file_name || data.name || item.file.name} — ${sum}</div>`;
      } else {
        item.status = 'failed'; item.error = data.error || 'Error';
        uploadResults.innerHTML += `<div class="result-item err">✕ ${item.file.name} — ${data.error || '失败'}</div>`;
      }
    } catch (e) {
      item.status = 'failed'; item.error = e.message;
      uploadResults.innerHTML += `<div class="result-item err">✕ ${item.file.name} — 网络异常</div>`;
    }
    renderQueue();
    uploadResults.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
  isProcessing = false; updateUI();
});
</script>
</body>
</html>
