<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📤 文件上传 — Library Agent</title>
<style>
  :root {
    --bg: #0f0f0f; --card: #1a1a1a; --border: #2a2a2a;
    --text: #e0e0e0; --muted: #888; --accent: #3ecf8e;
    --accent-dim: #2a5f3f; --danger: #f44; --danger-dim: #3a1a1a;
    --warn: #f0c040;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center;
    min-height: 100vh; padding: 40px 20px;
  }
  .container { width: 100%; max-width: 640px; }
  h1 { font-size: 1.4rem; margin-bottom: 6px; }
  .subtitle { color: var(--muted); margin-bottom: 28px; font-size: 0.88rem; }
  .nav { display:flex; gap:10px; margin-bottom: 24px; }
  .nav a {
    color: var(--muted); text-decoration:none; padding:5px 10px;
    border:1px solid var(--border); border-radius:6px; font-size:0.8rem;
  }
  .nav a.active { color: var(--accent); border-color: var(--accent-dim); background: #1a2a22; }

  /* ── Dropzone ── */
  .dropzone {
    border: 2px dashed var(--border); border-radius: 10px;
    padding: 28px; text-align: center; cursor: pointer;
    transition: border-color .2s, background .2s; margin-bottom: 16px;
  }
  .dropzone:hover, .dropzone.drag-over {
    border-color: var(--accent); background: #1a2a22;
  }
  .dropzone .icon { font-size: 1.8rem; margin-bottom: 8px; }
  .dropzone p { color: var(--muted); font-size: 0.85rem; }
  .dropzone .hint { font-size: 0.78rem; color: #555; margin-top: 6px; }
  #fileInput { display: none; }

  /* ── File Queue ── */
  .queue { margin-bottom: 16px; }
  .queue:empty { margin-bottom: 0; }

  .file-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 6px; transition: border-color .15s;
  }
  .file-item:hover { border-color: #444; }
  .file-item .type-icon {
    width: 32px; height: 32px; border-radius: 6px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1rem; flex-shrink: 0;
  }
  .type-icon.img { background: #1a2a22; }
  .type-icon.pdf { background: #2a1a1a; }
  .type-icon.docx { background: #1a2a3a; }
  .file-item .info { flex: 1; min-width: 0; }
  .file-item .name { font-size: 0.88rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-item .meta { font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
  .file-item .remove {
    width: 28px; height: 28px; border-radius: 6px; border: 1px solid transparent;
    background: none; color: var(--muted); cursor: pointer; font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; flex-shrink: 0;
  }
  .file-item .remove:hover { background: var(--danger-dim); border-color: #5a2a2a; color: var(--danger); }

  /* status badges */
  .file-item .status {
    font-size: 0.72rem; padding: 3px 8px; border-radius: 12px; flex-shrink: 0;
  }
  .status.waiting { background: #2a2a2a; color: #999; }
  .status.processing { background: #3a351a; color: var(--warn); }
  .status.done { background: #1a2a22; color: var(--accent); }
  .status.failed { background: var(--danger-dim); color: var(--danger); }

  /* ── Form ── */
  .form-row {
    display: flex; gap: 12px; margin-bottom: 14px;
  }
  .form-group { flex: 1; margin-bottom: 0; }
  .form-group label {
    display: block; font-size:0.82rem; color: var(--muted); margin-bottom: 5px;
  }
  .form-group input {
    width: 100%; padding: 9px 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 7px;
    color: var(--text); font-size: 0.88rem; outline:none;
  }
  .form-group input:focus { border-color: var(--accent); }

  button.primary {
    width: 100%; padding: 11px; background: var(--accent); color: #000;
    border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: opacity .2s;
  }
  button.primary:disabled { opacity: 0.4; cursor: not-allowed; }

  .clear-btn {
    background: none; border: 1px solid var(--border); color: var(--muted);
    padding: 5px 12px; border-radius: 6px; font-size: 0.78rem;
    cursor: pointer; transition: all .15s; margin-left: auto; display: none;
  }
  .clear-btn:hover { border-color: #555; color: var(--text); }
  .clear-btn.show { display: inline-block; }

  .queue-header {
    display: flex; align-items: center; margin-bottom: 8px;
    font-size: 0.8rem; color: var(--muted);
  }
  .queue-header { display: none; }
  .queue-header.show { display: flex; }

  /* ── Results ── */
  .results { margin-top: 24px; }
  .result-item {
    padding: 10px 14px; background: var(--card); border: 1px solid var(--border);
    border-radius: 8px; margin-bottom: 6px; font-size: 0.84rem;
  }
  .result-item.ok { border-left: 3px solid var(--accent); }
  .result-item.err { border-left: 3px solid var(--danger); }
  .spinner {
    display:none; width:16px; height:16px; border:2px solid var(--border);
    border-top-color: var(--accent); border-radius:50%;
    animation: spin .6s linear infinite; margin-right:8px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
  <h1>📤 文件上传</h1>
  <p class="subtitle">支持图片、PDF、DOCX — 多文件拖放，批量处理</p>

  <div class="nav">
    <a href="/upload-web/" class="active">📤 上传</a>
    <a href="/query-web/">🔍 搜索</a>
    <a href="/library-web/">📚 文件库</a>
  </div>

  <div class="dropzone" id="dropzone">
    <div class="icon">📁</div>
    <p>拖拽文件到此处 或 点击选择</p>
    <p class="hint">支持 JPG / PNG / GIF / WebP / PDF / DOCX（可多选）</p>
  </div>
  <input type="file" id="fileInput" accept="image/*,.pdf,.docx" multiple>

  <div class="queue-header show" id="queueHeader">
    <span id="queueCount"></span>
    <button class="clear-btn" id="clearAllBtn">清空全部</button>
  </div>
  <div class="queue" id="queue"></div>

  <div class="form-row">
    <div class="form-group">
      <label>上传人</label>
      <input type="text" id="uploader" placeholder="输入名称" value="test_user">
    </div>
  </div>

  <button class="primary" id="uploadBtn" disabled>上传全部文件</button>

  <div class="results" id="results"></div>
</div>

<script>
const API = '';

const dropzone  = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const queue     = document.getElementById('queue');
const queueHeader = document.getElementById('queueHeader');
const queueCount  = document.getElementById('queueCount');
const clearAllBtn = document.getElementById('clearAllBtn');
const uploadBtn = document.getElementById('uploadBtn');
const results   = document.getElementById('results');

let fileQueue = [];  // { id, file, status }
let isProcessing = false;

// Warn before leaving during upload
window.addEventListener('beforeunload', e => {
  if (isProcessing) {
    e.preventDefault();
    e.returnValue = 'Upload in progress, leaving will cancel it.';
  }
});

// ── Drag & drop ──
dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('drag-over'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag-over'));
dropzone.addEventListener('drop', e => {
  e.preventDefault();
  dropzone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', () => {
  addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

function addFiles(files) {
  files.forEach(f => {
    if (!isValid(f)) return;
    fileQueue.push({ id: Date.now() + Math.random(), file: f, status: 'waiting' });
  });
  renderQueue();
}

function isValid(f) {
  const name = f.name.toLowerCase();
  const ext = name.split('.').pop();
  return ['jpg','jpeg','png','gif','webp','bmp','pdf','docx'].includes(ext);
}

// ── Render queue ──
function renderQueue() {
  queue.innerHTML = fileQueue.map(item => {
    const f = item.file;
    const icon = typeIcon(f.name);
    const cls = typeClass(f.name);
    const size = f.size > 1024*1024
      ? (f.size/(1024*1024)).toFixed(1) + ' MB'
      : Math.round(f.size/1024) + ' KB';
    let statusHtml = '';
    if (item.status === 'processing') statusHtml = '<span class="status processing">⏳ 处理中</span>';
    else if (item.status === 'done') statusHtml = '<span class="status done">✓ 完成</span>';
    else if (item.status === 'failed') statusHtml = `<span class="status failed">✕ 失败</span>`;
    return `
      <div class="file-item" data-id="${item.id}">
        <div class="type-icon ${cls}">${icon}</div>
        <div class="info">
          <div class="name">${f.name}</div>
          <div class="meta">${size}${item.error ? ' · ' + item.error : ''}</div>
        </div>
        ${statusHtml}
        ${item.status === 'waiting' ? `<button class="remove" data-id="${item.id}" title="移除">×</button>` : ''}
      </div>`;
  }).join('');

  // bind remove buttons
  queue.querySelectorAll('.remove').forEach(btn => {
    btn.addEventListener('click', () => {
      removeFile(Number(btn.dataset.id));
    });
  });

  updateUI();
}

function removeFile(id) {
  fileQueue = fileQueue.filter(f => f.id !== id);
  renderQueue();
}

function updateUI() {
  const count = fileQueue.length;
  queueCount.textContent = count ? `${count} 个文件` : '';
  clearAllBtn.classList.toggle('show', count > 0);
  queueHeader.classList.toggle('show', count > 0);
  uploadBtn.disabled = count === 0 || fileQueue.some(f => f.status === 'processing');
  uploadBtn.textContent = count ? `上传 ${count} 个文件` : '上传全部文件';
}

clearAllBtn.addEventListener('click', () => {
  fileQueue = fileQueue.filter(f => f.status !== 'waiting');
  renderQueue();
});

// ── Type helpers ──
function typeIcon(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['png','jpg','jpeg','gif','webp','bmp'].includes(ext)) return '🖼';
  if (ext === 'pdf') return '📕';
  if (ext === 'docx') return '📄';
  return '📎';
}
function typeClass(name) {
  const ext = name.split('.').pop().toLowerCase();
  if (['png','jpg','jpeg','gif','webp','bmp'].includes(ext)) return 'img';
  if (ext === 'pdf') return 'pdf';
  if (ext === 'docx') return 'docx';
  return '';
}

// ── Upload ──
uploadBtn.addEventListener('click', async () => {
  const pending = fileQueue.filter(f => f.status === 'waiting');
  if (!pending.length) return;

  uploadBtn.disabled = true;
  isProcessing = true;
  const uploader = document.getElementById('uploader').value || 'test_user';
  results.innerHTML = '';

  for (const item of pending) {
    item.status = 'processing';
    renderQueue();

    const formData = new FormData();
    formData.append('file', item.file);
    formData.append('uploader', uploader);

    try {
      const resp = await fetch(`${API}/api/process`, { method: 'POST', body: formData });
      const data = await resp.json();

      if (resp.ok) {
        item.status = 'done';
        let summary = '';
        if (data.type === 'pdf') summary = `PDF · ${data.page_count}页 · ${data.indexed_count}图`;
        else if (data.type === 'docx') summary = `DOCX · ${data.image_count}图`;
        else summary = `图片 · ${data.embedding_dim}维`;
        results.innerHTML += `<div class="result-item ok">✓ ${data.file_name || data.name} — ${summary}</div>`;
      } else {
        item.status = 'failed';
        item.error = data.error || '未知错误';
        results.innerHTML += `<div class="result-item err">✕ ${item.file.name} — ${data.error || '失败'}</div>`;
      }
    } catch (e) {
      item.status = 'failed';
      item.error = e.message;
      results.innerHTML += `<div class="result-item err">✕ ${item.file.name} — ${e.message}</div>`;
    }
    renderQueue();
    results.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }

  isProcessing = false;
  updateUI();
});
</script>
</body>
</html>
